<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Ampeer">
  <!--
    The product in one mark: a day, in three bars.

    The second mark, since 2026-09-18. The first was a band with its midpoint,
    which is the site's one stylistic rule drawn small, and it said nothing to
    anybody who had not read that rule. The owner's brief was a mark that says
    what Ampeer does. What Ampeer does is look at where a household's
    electricity goes over a day: some used from the roof, some bought from the
    grid, some sent back. That is the strip on the first screen of the home
    page and the plate on every advice, and this is that strip at sixteen
    pixels: three bars on the instrument's ground, in the three colours the
    plate uses, own use in the middle and tallest because that is the thing
    the whole site is about.

    Colour is stated here rather than referenced because an icon is fetched
    on its own and reaches no stylesheet, and it does not follow the theme
    for the same reason the plate does not: a mark that changes colour is two
    marks. The four values are the carpet ground, offtake, own and export
    colours from globals.css. (No double hyphen may appear in this comment:
    XML forbids it, and a browser opening the file stops at that line.)
  -->
  <rect width="32" height="32" rx="7" fill="#071019"/>
  <rect x="5.5" y="15" width="6" height="11" rx="1.5" fill="#8b9ba8"/>
  <rect x="13" y="6" width="6" height="20" rx="1.5" fill="#f5c64a"/>
  <rect x="20.5" y="11" width="6" height="15" rx="1.5" fill="#3f6489"/>
</svg>
