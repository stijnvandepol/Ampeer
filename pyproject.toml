[project]
name = "ampeer-sim"
version = "0.6.2"
description = "Ampeer simulation core: synthetic household energy profiles and scenario simulation"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "requests>=2.32"]

[dependency-groups]
# The web layer, kept in its own group so the pure packages can still be
# installed and tested without Django anywhere near them.
backend = [
    "argon2-cffi>=25.1",
    # 5.2 is LTS with security support to April 2028. The current non-LTS line
    # runs out around April 2027, the quarter net metering ends and this product
    # is at its busiest, which would schedule a forced major upgrade for the
    # worst possible month.
    "django>=5.2.17,<6.0",
    "django-axes>=8.0",
    "django-cors-headers>=4.9",
    "djangorestframework>=3.18.0",
    # The WSGI server the production image runs. It sits in the backend group
    # rather than in [project] dependencies because the pure simulation core
    # must stay installable without a web server anywhere near it, and it is
    # here rather than only in the Dockerfile so `uv sync --locked` in the
    # image resolves the same lockfile the pipeline tested.
    "djangorestframework-simplejwt>=5.5",
    "gunicorn>=26.1",
    "psycopg[binary]>=3.3.4",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.5",
    "types-requests",
    "bandit[toml]>=1.7",
    "pip-audit>=2.7",
    "cyclonedx-bom>=4.4",
    "pre-commit>=3.7",
    "pyyaml>=6.0",
    "pytest-django>=4.14.0",
    # Without the stubs mypy cannot see through the ORM: every model attribute
    # becomes Any and strict mode turns into decoration.
    "django-stubs[compatible-mypy]>=6.1.0",
    "djangorestframework-stubs>=3.18.0",
    "semgrep>=1.174",
    "shellcheck-py>=0.11.0.1",
]

[build-system]
# Pinned, not floored. uv does not lock build backend requirements, so with a
# range here `uv sync --locked` reaches out to PyPI and executes whatever
# setuptools is newest that minute, under the very flag whose job is to
# forbid unlocked resolution. It is also invisible to pip-audit, which is fed
# the export rather than the build environment.
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
# Floor, so a stale uv cannot silently ignore flags this pipeline relies on.
# CI pins the exact version in the setup-uv step.
required-version = ">=0.12.5"
# Same reason as the build-system pin above: this is the only way to make
# the build environment reproducible, because uv.lock does not cover it.
build-constraint-dependencies = ["setuptools==84.0.0"]

[tool.setuptools.packages.find]
include = ["ampeer_sim*", "ampeer_advice*", "tools*"]
# backend/ is deliberately absent. It is a Django project run from its own
# directory, not a library anybody installs, and adding it here would put a
# module named `ampeer` on the installed path.

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
mypy_path = "backend"

[[tool.mypy.overrides]]
# django-axes ships no py.typed marker and no stub package exists on PyPI, so
# mypy_django_plugin's INSTALLED_APPS walk fails to analyse axes.models the
# moment "axes" is added to INSTALLED_APPS. Every accounts.lockout callable
# axes calls stays fully typed; this silences only the one third-party module
# mypy cannot see into.
module = "axes.*"
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "ampeer.settings.test"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Ruff's default rule set applies. FURB157 is the single exception: it rewrites
# Decimal("800") into Decimal(800), and this project writes every monetary literal
# as a quoted string on purpose. Decimal("0.05") is exact where Decimal(0.05) is
# not, so a rule that trains the reader to drop the quotes is a hazard in code
# that handles money. Drop this ignore once no monetary literal depends on it.
ignore = ["FURB157"]

[tool.ruff.lint.isort]
# backend/ is on the pytest pythonpath rather than installed, so ruff cannot
# infer that `advice` and `ampeer` are ours: it sees no distribution of that
# name and files them as third party, which puts them in the wrong import block
# in every test that touches the API. They genuinely are first party, so say so.
known-first-party = ["accounts", "advice", "ampeer", "ampeer_sim", "ampeer_advice", "tools"]

[tool.ruff.lint.per-file-ignores]
# django.db.migrations.Migration declares `dependencies` and `operations` as
# instance attributes, so annotating them ClassVar in a generated migration is a
# mypy error and RUF012 is a false positive on shape the framework owns. Every
# migration Django will ever generate hits it, and a per-file rule is honest
# where a noqa on each line is a ritual.
"backend/*/migrations/*.py" = ["RUF012"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# backend/ is not installed, so this is how `ampeer.settings.*` and the Django
# apps under it become importable from the tests.
pythonpath = ["backend"]
DJANGO_SETTINGS_MODULE = "ampeer.settings.test"
filterwarnings = ["ignore::DeprecationWarning:pytest_asyncio.*"]
# Wall clock budgets from the definition of done, run outside the coverage
# invocation. Measured on 2026-08-24 over the whole suite: the cached advice
# test takes 0.58s uninstrumented and 1.62s under coverage, against a budget of
# 1.0s. Under coverage the check therefore tested the promise divided by the
# profiler, sat on its own boundary, and flipped between runs on the same
# commit. A gate that changes verdict without the code changing teaches people
# to re-run until green, which is the one habit that makes every other gate
# worthless.
markers = ["perf: a wall clock budget; excluded from the coverage run, see the note above"]
# --strict-markers is what makes the split above hold. The two invocations select
# on the spelling of one word, so without it a marker typed `perff` raises a
# warning nobody reads, stays inside `-m "not perf"`, and is measured under the
# profiler again: the exact defect the split was made to fix, reintroduced
# silently by a typo. Shown rather than argued, on 2026-08-27, on a file written
# outside this tree so that no mistyped marker lands in it: a test marked
# `perff` and run under `-m "not perf"` against this config exits 2 and collects
# nothing, with "'perff' not found in `markers` configuration option". Against
# the same config with this line removed it is selected, runs, passes, and exits
# 0 with a PytestUnknownMarkWarning, which is a warning inside a run whose whole
# point is that the test is not in it.
addopts = ["--strict-markers"]

[tool.coverage.run]
source = ["ampeer_sim", "ampeer_advice", "tools", "backend"]
# Branch coverage, on since 2026-09-07, measured under the condition the
# runner measures under (without data/nedu-profiles-2025.csv). Statement
# coverage reads a multi-line ternary as one statement, which is how the
# wait is None arm of _AuthAPIView.throttled stayed invisible until a
# reviewer found it with a scratch reproduction (decision 40's follow-up,
# "Whether branch = true belongs in the coverage configuration" in
# docs/decisions.md). Turning it on may only happen together with a floor
# re-measured under it, never by lowering the floor; see fail_under below
# for that measurement.
branch = true
# Two entry points and nothing else. Django generates both, neither holds a
# decision, and neither is imported by a test. Every other line under backend/
# is measured. This list is asserted to stay exactly this short by
# tests/test_pipeline_contract.py, because an omit list is the quietest way to
# make a coverage floor stop meaning anything.
omit = ["backend/manage.py", "backend/ampeer/wsgi.py"]

[tool.coverage.report]
# precision = 2 is load bearing, not cosmetic. pytest-cov decides its exit code
# with round(total, precision) < fail_under. At the default precision of 0 a
# real 96.86 rounds to 97 and the run exits green while printing FAIL in its own
# log, which makes a required status check that can never go red. Verified by
# raising the floor and asserting a non-zero exit.
precision = 2
# Measured at two decimals, not read off the rounded TOTAL row. Raised from
# 97 to 98 on 2026-08-20 after covering the ingest CLI took the tree to
# 98.03, then from 98 to 99.05 on 2026-09-06 at the end of the accounts
# frontend branch, then from 99.05 to 99.15 on 2026-09-07 at the end of the
# accounts recovery branch, from a run without data/nedu-profiles-2025.csv
# that measured 2728/2751 = 99.1639, rounded to 99.16, and from 99.15 to
# 98.73 on 2026-09-07 at the end of the legal and tidy branch, the first
# measurement with branch = true on. This is a new measure, statement plus
# branch together, and it therefore sits below what the statement-only
# figure on the same tree reports: statement-only stays at 2741/2764 =
# 99.17% on this tree (above 99.15), and no protection has been removed by
# the drop in the number reported here. The combined run (2764 statements,
# 23 missed, 402 branches, 17 partial) measured 98.74%, without
# data/nedu-profiles-2025.csv, and from 98.73 to 98.82 on 2026-09-09 at the
# end of the meter link branch, from a run without that file that measured
# 2979 statements, 23 missed, 432 branches, 17 partial, so 3371/3411 =
# 98.8273%, rounded to 98.83. May be raised, never lowered: a floor below
# the current level makes a regression invisible.
#
# The floor sits one hundredth UNDER the measurement, and that hundredth is
# the whole point. True coverage is 2411/2434 = 99.0551, and pytest-cov
# compares round(total, precision) with fail_under: at 99.06 the comparison
# is 99.06 < 99.06, false, so the run exits 0 while `_failed_cov_total`
# prints "FAIL Required test coverage of 99.06% not reached" in the same
# output. A required check that prints FAIL and exits green is worse than a
# missing one. At 99.05 the same run prints PASS and still fails on a single
# lost line: 2410/2434 rounds to 99.01, which is below 99.05.
#
# The measurement that counts is the CI runner's, not a developer machine's.
# A machine that has run tools/ingest_profiles.py carries the NEDU file that
# two tests skip without, and on 2026-09-06 one of those tests was the only
# caller of a method, so the tree measured 99.06 on Windows and 99.01 on the
# runner, and the floor set from the local figure went red in CI on its first
# run. Set the floor from a run without data/, or from the runner.
fail_under = 98.82
show_missing = true

[tool.bandit]
# tests is excluded on purpose and not by oversight. Measured on 2026-08-22:
# bandit reports 1210 B101 assert_used findings there, one per assertion,
# plus 41 hardcoded password hits that are all fixture tokens. A scan whose
# output is that noisy is one nobody reads, and this project needs sast to
# stay worth reading. What the tests get instead is ruff, mypy --strict and
# gitleaks, all three of which do cover them.
exclude_dirs = ["tests", ".venv", "build"]
