# THIS FILE MUST NEVER BE USED ON A HOST. It exists so the seven checks in
# section 12 of docs/superpowers/specs/2026-08-21-deploy-design.md can be run
# against a real stack on a developer machine, and for nothing else.
#
# It changes exactly four things. Three of them are things that would be a
# defect in production, and the fourth is what keeps this file away from it:
#
#   1. It publishes a port. The whole network design is that nothing listens:
#      cloudflared makes an outbound connection and there is no inbound route
#      anywhere. A local run has no tunnel, so there has to be some way in, and
#      it is bound to 127.0.0.1 so it is a way in from this machine only.
#   2. It stops the tunnel from starting. A connector needs a real credential,
#      and running one from here would register a route to a Cloudflare tunnel
#      that serves a real domain. That is a change to a host, which is out of
#      bounds for every task in this subproject.
#   3. It mounts a synthetic consumption profile. See the header of the file it
#      mounts: it is a flat curve, it proves the plumbing, and the arithmetic
#      it produces is not an advice.
#   4. It renames the project, which is the `name:` below and the only line
#      here that is not about the stack at all. See the comment on it.
#
# infra/docker-compose.yml is untouched by all of this, and stays the file that
# runs on the host. tests/test_stack_smoke.py asserts that the production file
# still publishes nothing, that this override binds only to the loopback, and
# that this file names no image of its own, so a `docker compose -f
# docker-compose.yml -f compose.test.yml` run is the production stack with a
# door held open rather than a different stack.
#
# Both fixtures below are generated, git-ignored, and have to exist before this
# file is used:
#
#   uv run python tests/test_stack_smoke.py
#
# writes infra/fixtures/nedu-flat-2025.csv and infra/fixtures/env.smoke. Then:
#
#   docker compose -f infra/docker-compose.yml -f infra/compose.test.yml \
#     --env-file infra/fixtures/env.smoke build
#   docker compose -f infra/docker-compose.yml -f infra/compose.test.yml \
#     --env-file infra/fixtures/env.smoke up -d
#
# and the site is on http://127.0.0.1:8080/.

# THE LINE THAT KEEPS A LOCAL TEARDOWN LOCAL.
#
# docker-compose.yml sets `name: ampeer`, and compose takes the project name
# from the last file that names one, so without this line every command that
# includes this override ran under the production project name. The last
# command in section 7 of infra/README.md is `down -v`, and `-v` removes named
# volumes: typed in a checkout on a machine whose docker context points at the
# LXC, those eight characters delete the database that holds every stored
# advice. Nothing in this repository takes a backup of it or mentions one.
#
# It was survivable only by habit: the audits ran everything under an explicit
# `-p`, which is a property of whoever typed the command and not of any file.
# This makes it a property of the file. `docker compose -f docker-compose.yml
# -f compose.test.yml ... down -v` now names `ampeer-local`, and the production
# project cannot be reached by any command that includes this file.
#
# It does not protect a `down -v` against docker-compose.yml alone. Nothing
# can: that is the production teardown and it has to keep working. What can be
# done there is done in the README, which no longer prints the two words next
# to each other outside this override.
name: ampeer-local

services:
  api:
    volumes:
      # Compose merges a volume list by its target path, so this replaces the
      # bind mount in docker-compose.yml rather than adding a second one at the
      # same place. Written here as a relative path on purpose: compose
      # resolves it against the project directory, which is infra/, so this
      # works on a Windows developer machine where the host path in an env file
      # would have to be spelled in a form the daemon accepts.
      - ./fixtures/nedu-flat-2025.csv:/srv/profiles/nedu.csv:ro

  web:
    ports:
      # 127.0.0.1 and not 0.0.0.0. Docker publishes a port by writing a
      # forwarding rule that is evaluated before the host firewall, so
      # "8080:80" would be reachable from the local network no matter what the
      # firewall says, and a developer laptop is on somebody's wifi. The
      # interface is the whole protection here.
      #
      # Port 80 inside, because that is what web.Dockerfile exposes and what
      # the tunnel route names on the real host. 8080 outside, because binding
      # 80 on a developer machine needs privileges this does not have.
      - "127.0.0.1:8080:80"

  tunnel:
    # A profile that is never enabled, which is how compose is told to leave a
    # service alone. `docker compose up` skips it; `docker compose config
    # --no-interpolate` still shows it, so the override does not hide the
    # fourth service from anybody reading the merged file.
    #
    # --no-interpolate is not a detail. Plain `docker compose config` prints
    # every variable with its value substituted, and three of the values in
    # this stack are credentials. Measured on 2026-08-21 against the production
    # file with a placeholder env file, the merged output contained the
    # connector token, plus DJANGO_SECRET_KEY and POSTGRES_PASSWORD twice, all
    # in cleartext on a terminal and in whatever scrollback or CI log that
    # terminal writes to. --no-interpolate prints
    # `${CLOUDFLARE_TUNNEL_TOKEN}` instead, which answers every question about
    # the shape of the document and none about its secrets.
    #
    # The token moved off the command line on 2026-09-01, because argv is
    # readable through /proc by every local account where an environment is
    # not. It is now `TUNNEL_TOKEN` under `environment:`, and this paragraph
    # used to say the merged output carried `--token` on the line below, which
    # stopped being true with that move. What did not change is the reason for
    # the flag: `docker compose config` substitutes an environment value just
    # as readily as a command line one, so the token is still printed in
    # cleartext without it.
    #
    # It is not deleted, because a compose override cannot delete a service and
    # faking it with an inert command would produce a container that is up and
    # doing nothing, which is the exact shape of failure this whole subproject
    # keeps finding. Absent and named is honest; present and pretending is not.
    profiles: ["tunnel-is-never-started-from-a-test"]
