# The edge. It does two things: it serves the statically exported site, and it
# forwards /api/ to gunicorn on the same origin, so there is no preflight in the
# request path and no second certificate.
#
# This file replaces the image's own nginx.conf rather than dropping a server
# block into conf.d, because three of the decisions below (server_tokens, the
# log format, the map that feeds it) live in the http context and a partial file
# would leave the defaults for them in place.
#
# Two lines in here decide whether the product works at all. They are marked.

user  nginx;
worker_processes  auto;
pid   /var/run/nginx.pid;

# warn, not the default error: at `error` level nginx writes the failing request
# line, and on this site two request lines carry a token. The per-location
# override under /api/advice/ raises it further for the one route where an
# upstream failure is routine and the path is a secret.
error_log  /dev/stderr  warn;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Not a fingerprinting defence, an inventory one: without this every 404
    # page and every response header names the exact build, so anybody looking
    # for hosts running a version with a published advisory finds this one by
    # asking it.
    server_tokens off;

    # ---------------------------------------------------------------------
    # THE SECOND LINE THAT MATTERS: what the access log is allowed to know.
    #
    # The audit log in the database stores the token hashed and no IP address
    # at all. nginx's built-in `combined` format writes
    #   <client ip> - - [time] "GET /api/advice/<token>/" 200 1234 "<referer>"
    # which is the plaintext token, the visitor's address and the pairing of
    # the two, in a file whose retention nobody in this project has chosen.
    #
    # Two routes carry a token, not one: the API call and the page the visitor
    # is sent to after answering four questions. This map rewrites both to a
    # route label, so the log still answers "is this route being hit and is it
    # answering" and answers nothing about who or which advice.
    #
    # $uri and not $request_uri on purpose: $uri is normalised and decoded, so
    # an encoded token cannot slip past the pattern, and it carries no query
    # string. The token length comes from advice.urls.TOKEN_LENGTH, which is
    # derived from the number of bytes the token is actually made of;
    # tests/test_nginx_config.py reads that constant and fails if this drifts.
    #
    # It fails closed. Until 2026-08-21 the default arm was `$uri`, which made
    # this an allowlist that logs anything it does not recognise verbatim, and
    # the two prefixes it exists to protect are precisely where an unrecognised
    # path is most likely: measured against a running stack,
    # `GET /api/advice/<token>` without the trailing slash is a 301 from
    # Django's APPEND_SLASH and was logged with the token in it, as was every
    # suffix under either prefix. That is the same shape as the 413 in the
    # error log that the /advies/ block below already had to fix: a non-200
    # that nobody thought to enumerate.
    #
    # So `$uri` is reachable only from an arm that proves the path carries no
    # token. Two things prove it: an exact match against one of the three
    # token-free API routes, or a path that is under neither prefix at all.
    # Everything else gets a label. The `:other` arms are what keep the log
    # able to say "something is hitting this prefix and being refused" without
    # saying what.
    # ---------------------------------------------------------------------
    map $uri $route_without_token {
        # Fail closed. Nothing should reach this arm, because the last arm
        # below matches every path that starts with a slash, and that is
        # exactly why it is a constant: an arm nobody expects to fire is an arm
        # nobody will check when they change the ones above it.
        default                                 "/other";

        # The three routes under /api/advice/ that carry no token. They are
        # named so the log can still answer "is the compute endpoint being hit
        # and is it answering", which is most of what it is for. nginx compares
        # exact sources before any regex, whatever order they are written in.
        # tests/test_nginx_config.py reads them out of advice.urls and fails if
        # a fourth one is added here without one.
        /api/advice/health/                     /api/advice/health/;
        /api/advice/estimate/                   /api/advice/estimate/;
        /api/advice/refine/                     /api/advice/refine/;

        # The built advice page. $uri is re-evaluated when the line is written,
        # after try_files below has already redirected /advies/<token>/ to this
        # internal path, so this is what a visitor opening a shared link
        # actually logs as. Measured against a running nginx on 2026-08-21;
        # without this arm those requests fall to the /advies/ label below and
        # the log stops being able to tell a served page from a refused one.
        /advies/index.html                      /advies/index.html;

        "~^/api/advice/[A-Za-z0-9_-]{22}/$"     "/api/advice/:token/";
        "~^/advies/[A-Za-z0-9_-]{22}/?$"        "/advies/:token/";

        # Anything else under a prefix that carries tokens: a label, never the
        # path. Deliberately not narrowed to "looks like a token", because
        # /api/advice/x/<token>/ does not and would then be logged in full.
        "~^/api/advice"                         "/api/advice/:other";
        "~^/advies"                             "/advies/:other";

        # Everything else, as itself. The lookahead is a second, independent
        # guard: the two arms above already take every path under either
        # prefix, and this one cannot log a path from those prefixes even if
        # somebody reorders the block.
        "~^(?!/api/advice|/advies)/"            $uri;
    }

    # Deliberately without $remote_addr, $http_x_forwarded_for and
    # $http_referer. The first is the tunnel connector's container address and
    # says nothing; the second is the visitor and is the thing not to keep; the
    # third is /advies/<token>/ on every asset that page loads, which would put
    # the token back in by the side door. $status and $upstream_status are
    # separate because a 502 from nginx and a 500 from Django are different
    # faults and the pair is how you tell them apart at a glance.
    log_format privacy  '$time_iso8601 $request_method $route_without_token '
                        '$status $body_bytes_sent $request_time $upstream_status';

    # /dev/stdout, so nothing is written inside the container and the retention
    # is whatever the Docker log driver is configured to keep. That is still a
    # retention nobody has chosen: the default json-file driver keeps everything
    # until the container is removed. Setting max-size and max-file belongs in
    # infra/docker-compose.yml, which this lane does not own, and it is reported
    # rather than quietly left.
    access_log  /dev/stdout  privacy;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    # 16k. The largest legitimate request this service accepts is the refine
    # POST: thirteen scalar fields, about 400 bytes of JSON. Django would accept
    # up to DATA_UPLOAD_MAX_MEMORY_SIZE, 2.5 MB by default, before its serializer
    # refused the content, so between 400 bytes and 2.5 MB sit two and a half
    # megabytes that get read into the API's memory only to be thrown away. They
    # should not travel that far. 16k is forty times the real maximum, which is
    # room for a field to be added without anybody having to think about it.
    client_max_body_size 16k;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/manifest+json;

    server {
        listen       80;
        server_name  _;

        root  /usr/share/nginx/html;
        index index.html;

        # nginx builds directory redirects as absolute URLs from the scheme it
        # is listening on, which here is http, so /berekenen would send the
        # visitor to http://ampeer.nl/berekenen/ and downgrade a connection that
        # arrived over https. Relative redirects have no scheme to get wrong.
        absolute_redirect off;

        # The API sets its own equivalents on its own responses; these are for
        # the pages, which Django never sees. The connect-src is what makes the
        # same-origin decision enforceable in the browser: this site has no
        # reason to talk to any other host, and if a build ever ships with an
        # API base pointing somewhere else, this turns a silent data flow into a
        # blocked request. 'unsafe-inline' is unavoidable while the export
        # inlines its own bootstrap script and styles and there is no server to
        # mint a nonce.
        add_header X-Content-Type-Options  "nosniff" always;
        add_header X-Frame-Options         "DENY" always;
        add_header Referrer-Policy         "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

        # These are inherited by every location below that does not set one of
        # its own. Kept here rather than repeated per location precisely because
        # proxy_set_header inheritance is all or nothing: a location that adds
        # one header loses every header set above it, which is how an
        # X-Forwarded-For quietly stops being sent.
        proxy_set_header Host $host;
        # SET, not passed through. prod.py trusts X-Forwarded-Proto through
        # SECURE_PROXY_SSL_HEADER, and that is only correct if the proxy
        # overwrites whatever the caller sent; otherwise one header turns off
        # every https-only cookie flag and the redirect that enforces TLS.
        #
        # The constant is not a shortcut for $scheme. Cloudflare terminates TLS
        # at the edge and the connector speaks plain HTTP to this container, so
        # $scheme is http on every request, including the ones that arrived over
        # https. Sending that would make Django treat every request as insecure,
        # SECURE_SSL_REDIRECT would answer 301 to the same URL, the tunnel would
        # deliver it straight back, and every API call would be a redirect loop.
        # Nothing reaches this server except through the tunnel: no port is
        # published, so there is no plain-http caller for whom https is a lie.
        proxy_set_header X-Forwarded-Proto https;
        # Appended, the standard way. DJANGO_NUM_PROXIES counts hops from the
        # right of this header, so appending is what keeps the count landing on
        # the hop the connector wrote: a forged value only makes the list longer
        # on the left. Overwriting instead would give every visitor the
        # connector's address and one shared rate limit; not appending at all
        # would let a caller change the hop count and buy a fresh limit, which
        # was measured on this API on 2026-08-21.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        # Below gunicorn's own 30 second worker timeout, so a request that hangs
        # is answered here rather than held open: api.ts has no client-side
        # abort, and a socket that never closes leaves "Uw advies wordt
        # opgehaald" on the screen forever.
        proxy_read_timeout 35s;
        proxy_connect_timeout 5s;

        # -----------------------------------------------------------------
        # THE FIRST LINE THAT MATTERS.
        #
        # The site is statically exported, so there is exactly one built advice
        # page and no route per token. Without this fallback the 404 is not
        # only for whoever opens a shared link: the question flow ends in a full
        # navigation to /advies/<token>/, so the visitor who just answered four
        # questions gets it too, for an advice that has been computed, stored
        # and charged against their hourly budget and that they will never see.
        # A hundred percent broken, not fifty.
        # -----------------------------------------------------------------
        location /advies/ {
            try_files $uri $uri/ /advies/index.html;

            # The access log above is safe here, the error log was not.
            # Measured on 2026-08-21 against this image: a POST larger than
            # client_max_body_size to this path writes
            #   [error] client intended to send too large body: 135091 bytes,
            #   client: 172.20.0.1, request: "POST /advies/<token>/ HTTP/1.1"
            # which is the token and an address on one line, from the one
            # location whose paths are all secrets. Nothing legitimate posts
            # here and the fallback target's existence is asserted at build
            # time, so there is no error-level message from this location worth
            # the exchange.
            error_log /dev/stderr crit;
        }

        # Longest prefix wins, so this handles the token route and the /api/
        # block below handles estimate and refine. It exists for one reason: to
        # keep nginx from writing this path anywhere.
        # Docker's embedded DNS. nginx resolves a literal upstream name once, at
        # startup, and refuses to start when it fails: measured 2026-08-21,
        # stopping the api container and restarting web gave
        # "[emerg] host not found in upstream \"api\"" and the whole site
        # returned 000, not a 502 on /api/ alone. A statically exported page
        # that needs no API and no database was dark because Postgres would not
        # start, and Docker's restart policy does not honour depends_on, so on a
        # host reboot the ordering that protects `docker compose up` is absent
        # exactly when nobody is logged in.
        #
        # With a resolver and a variable upstream, nginx starts regardless and
        # answers 502 for /api/ while serving every page. valid=10s so a
        # recreated api container is picked up without a reload.
        resolver 127.0.0.11 valid=10s ipv6=off;
        resolver_timeout 5s;

        location /api/advice/ {
            # Named explicitly even though the http-level default is the same
            # format. This is the location the promise is about, and a default
            # is a thing somebody changes elsewhere without reading this.
            access_log /dev/stdout privacy;
            # crit, so the routine upstream failures are not logged here. nginx
            # writes the full request line into the error log at `error` level
            # ("connect() failed ... request: \"GET /api/advice/<token>/\""),
            # which is the token, in plaintext, on the first day the API is
            # down. Anything worse than crit is still logged, and a 502 is still
            # visible in the access log above as a status.
            error_log /dev/stderr crit;
            # A variable upstream, resolved per request, not at startup. See the
            # resolver note below: with a literal here nginx refuses to start
            # while the name does not resolve, so a database that fails to come
            # up takes the statically exported site down with it.
            #
            # $request_uri is not optional. proxy_pass with a literal and no URI
            # forwards the request path unchanged; with a variable it does not,
            # and every path would arrive at the API as "/".
            set $ampeer_api api;
            proxy_pass http://$ampeer_api:8000$request_uri;
        }

        location /api/ {
            set $ampeer_api api;
            proxy_pass http://$ampeer_api:8000$request_uri;
        }

        # Content-addressed by the build, so it can be cached hard. `expires`
        # rather than add_header, which would drop every security header set
        # above it in this block.
        location /_next/static/ {
            expires 1y;
        }

        location / {
            try_files $uri $uri/ =404;
        }

        error_page 404 /404.html;
        location = /404.html {
            internal;
        }
    }
}
