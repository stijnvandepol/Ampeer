# Every image that comes from a registry is pinned by digest. A tag is a name
# somebody else can repoint, and this file is the last place a change is read
# before it runs on the host. The four digests below were resolved from the
# registry on 2026-08-21; re-resolve when bumping and write down what you got.
#
# The two images built from this repository carry both `image:` and `build:`.
# The deploy pulls the published one; a developer can bring the same stack up
# locally without a registry. They are the same file, which is the point. Those
# two are the only images here without a digest, because the release tag is not
# known until the deploy that creates it, and tests/test_infra.py asserts that
# the exemption is exactly those two names.
#
# Nothing in this file makes anything reachable. cloudflared opens an outbound
# connection, so there is no published port, no host network, and no inbound
# firewall rule anywhere on the path. Adding one here is the single change that
# would undo that, which is why a test reads this file for it.
name: ampeer

# How long the container logs live, chosen here rather than inherited.
#
# Everything in this stack writes to stdout and stderr on purpose: nginx logs to
# /dev/stdout and /dev/stderr, gunicorn and Django log to stderr, and the purge
# prints a count. None of it is written inside a container. That moves the whole
# retention question to the log driver, and Docker's default json-file driver
# keeps every byte until the container is removed, with no rotation at all.
# `restart: unless-stopped` on all four services means these containers are not
# removed, so "until it is removed" is "for as long as the machine lives".
#
# Section 9 of the design asks for that retention to be set explicitly, on the
# grounds that a retention nobody chose is not a retention. So:
#
#   max-size 10m   Measured against this stack on 2026-08-21 over 280 real
#                  access lines: one line in nginx's `privacy` format averages
#                  66 bytes and never exceeded 72, and the json-file driver
#                  wraps each one in a 70 byte envelope carrying a timestamp
#                  and a stream name. So a logged request costs about 136
#                  bytes, and 10 MB is roughly 77 thousand requests per file.
#   max-file 5     Five files, so the ceiling is 50 MB per service and 200 MB
#                  for the whole stack, and what can be read back is about 385
#                  thousand requests. Rotation then discards a fifth at a time
#                  instead of everything, which is what keeps the oldest file
#                  useful while the newest one is being written.
#
# The ceiling is the decision; the number of days it buys is a consequence of
# how busy the site is and is deliberately not claimed here. What these two
# numbers guarantee is that no log on this host can grow without bound, and
# that is the property that was missing.
#
# This is not monitoring and it does not make anything visible. Nothing reads
# these files, nothing alerts on them, and section 1 of the design puts
# monitoring out of scope. See infra/README.md.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# The one flag every service carries, written once and referenced four times
# for the same reason `logging` is: one edit to get right, one omission to get
# wrong.
#
# Without it a setuid binary left in a base image is a path from an
# unprivileged process back to uid 0, which makes `USER ampeer` in
# api.Dockerfile and every `cap_drop` below advisory rather than binding. The
# whole point of the api running as uid 10001 is that a bug in gunicorn cannot
# become root. Docker does not set this by default and there is no way to set
# it once for a stack.
x-hardening: &no-new-privileges
  - "no-new-privileges:true"

# What each container may use, and where the numbers come from.
#
# Docker gives a container the whole machine unless told otherwise, and this
# stack has one service that will find that out. ampeer_sim works in
# quarter-hour series for a whole year: 35040 float64 values, 280320 bytes,
# 0.267 MB each. ampeer_sim.simulate.run_advice runs a 243 point sensitivity
# grid, of which 27 combinations move energy rather than only prices, and it
# keeps all 27 of those EnergyFlows in `flows_cache` for the length of the
# request. With a battery an EnergyFlows holds nine distinct series, so that
# cache alone is 27 x 9 x 0.267 = 65 MB of live array per in-flight request,
# before the timestep loop's own seven Python lists of 35040 floats.
#
# Measured rather than reasoned about, on 2026-09-01, by running one whole
# request in one process (run_advice plus ampeer_advice.advise, battery path,
# flat profile, FallbackProvider) and reading the peak working set:
#
#   the two packages and numpy imported, at rest              41 MB
#   django, DRF and psycopg imported                          40 MB
#   peak while serving one battery request                   120 MB
#
# entrypoint-api.sh runs three gunicorn workers, so three concurrent battery
# requests peak near 3 x 120 = 360 MB plus the master. `mem_limit: 768m` is a
# little over twice that: high enough that a leap year, a household with a car
# and a heat pump, and allocator fragmentation cannot reach it, and low enough
# that a runaway is one restarting container instead of a host whose OOM killer
# picks whichever process is largest, which here is as likely to be Postgres as
# the api that caused it.
#
# That measurement was taken on the development machine and not inside the
# image. The array arithmetic above does not depend on the platform; the
# interpreter and library baseline does. So 768m is deliberately set at twice
# the measured peak rather than just above it, and `docker stats` on the LXC is
# what confirms it.
#
# The other three are ceilings derived from what the images are configured to
# do, not measurements:
#
#   db      512m  postgres 16 on the image's defaults: shared_buffers 128 MB,
#                 maintenance_work_mem 64 MB, wal_buffers 4 MB, and at most a
#                 handful of backends, three gunicorn workers plus the
#                 occasional `compose run --rm api`, at work_mem 4 MB and a few
#                 MB of private memory each. About 220 MB. Page cache is
#                 charged to the same cgroup but is reclaimed under pressure
#                 rather than causing a kill.
#   web     256m  nginx with `worker_processes auto`, so one worker per core,
#                 at roughly 10 MB each with this configuration and no cache.
#   tunnel  256m  cloudflared is a Go binary holding a connection pool.
#
# These are caps, not reservations. Their sum, 1.75 GB, may be more than the
# LXC has, and that is the intended shape: the property being bought is that no
# single container can take the machine, not that the machine is divided up.
#
# NOT SET HERE, and this is a decision rather than an oversight: `read_only`
# with `tmpfs` for the paths each image writes to. All four would need at least
# one such path. The api's gunicorn 26 control server writes under
# /home/ampeer, which api.Dockerfile already had to discover the hard way.
# nginx writes /var/cache/nginx and its pid file. postgres writes
# /var/run/postgresql. None of those lists can be confirmed by reading, only by
# running the stack, and this file is copied to the host by hand while a deploy
# destroys the previous container before the new one is known to serve. An
# unverified `read_only` here is a site that goes down at the moment nobody can
# roll back. It goes in after somebody has run `docker compose up -d` on the
# LXC with it, not before.

services:
  db:
    networks: [back]
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    logging: *logging
    restart: unless-stopped
    security_opt: *no-new-privileges
    mem_limit: 512m
    cap_drop: [ALL]
    # What the official entrypoint does as root before `exec gosu postgres`,
    # and nothing else. Each name below is one operation in that script:
    #
    #   CHOWN          the `find ... -exec chown postgres` over the data
    #                  directory and over /var/run/postgresql
    #   FOWNER         chmod 00700 on the data directory and 03775 on
    #                  /var/run/postgresql, neither of which uid 0 owns
    #   DAC_OVERRIDE   writing inside those directories, which postgres owns
    #   SETUID SETGID  gosu, which is the whole reason the entrypoint is root
    #
    # UNVERIFIED against a running container: Docker was down when this was
    # written, so it is read off the entrypoint of the docker-library postgres
    # 16 bookworm image rather than measured. A missing capability here is a
    # container that will not initialise, so bring the stack up once on the
    # host before the first deploy that carries this file.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    # log_error_verbosity=terse drops the DETAIL and HINT lines from an error.
    #
    # prod.py now sets server_side_binding, so a failing statement is logged as
    # `INSERT ... VALUES ($1, $2)` rather than with the values inlined. That
    # closes STATEMENT and not DETAIL: the server builds that line from the row
    # itself, so a unique violation still prints `Key (token)=(<the token>)`.
    # Measured on 2026-08-21 with both bindings against this image.
    #
    # The db container is the one service a deploy never recreates, so its log
    # is the longest lived in the stack: measured at roughly a year at this
    # write rate. A token there outlasts by a wide margin the ninety day purge
    # of the row it opens.
    #
    # The cost is real and is the reason this is a decision rather than an
    # obvious win: DETAIL is where a constraint violation says which value
    # broke it, so debugging a genuine data fault gets harder. That is the
    # right trade for a table whose keys are credentials.
    command:
      - postgres
      - -c
      - log_error_verbosity=terse
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ampeer-db:/var/lib/postgresql/data
    healthcheck:
      # $$ so compose leaves the expansion to the shell inside the container;
      # a single $ would interpolate here and bake the value into the file.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    networks: [back]
    image: ghcr.io/stijnvandepol/ampeer-api:${AMPEER_VERSION}
    logging: *logging
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    restart: unless-stopped
    security_opt: *no-new-privileges
    # See the block above `services` for where this number comes from.
    mem_limit: 768m
    # Nothing added back, and this is the one service where that needs no
    # qualification. api.Dockerfile switches to `USER ampeer`, uid 10001,
    # before the entrypoint runs, entrypoint-api.sh execs gunicorn directly,
    # and no process in this image ever runs as uid 0, so there is no phase
    # that could use a capability even if it had one.
    cap_drop: [ALL]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: ampeer.settings.prod
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS}
      DJANGO_NUM_PROXIES: ${DJANGO_NUM_PROXIES}
      # The path inside the container, which is fixed by the mount below. The
      # variable of the same name in the env file is the path on the host: one
      # name, two sides of the same bind mount, and the preflight checks the
      # host side because that is the one that can be wrong.
      AMPEER_NEDU_PROFILE_PATH: /srv/profiles/nedu.csv
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
    volumes:
      # Read only: this is somebody else's data under redistribution terms that
      # are not confirmed, and nothing here has a reason to write to it.
      - ${AMPEER_NEDU_PROFILE_PATH}:/srv/profiles/nedu.csv:ro
    # No healthcheck here on purpose. api.Dockerfile declares its own, and it
    # is the only place that knows two things this file got wrong within hours
    # of being written: the route is /api/advice/health/, because advice.urls
    # is mounted under api/advice/, and the request needs an
    # X-Forwarded-Proto: https header, because SECURE_SSL_REDIRECT turns a
    # plain loopback request into a 301 that urlopen follows into a TLS
    # handshake against a plain socket. A compose healthcheck overrides the
    # image's, so this block was a second copy that could only ever be stale,
    # and while it was here the api container could never become healthy and
    # `depends_on: service_healthy` would never have released.

  web:
    # Both, and the only service on both. That is what makes nginx the one path
    # from the tunnel to Django.
    networks: [edge, back]
    image: ghcr.io/stijnvandepol/ampeer-web:${AMPEER_VERSION}
    logging: *logging
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
    restart: unless-stopped
    security_opt: *no-new-privileges
    mem_limit: 256m
    cap_drop: [ALL]
    # The exception in this stack, and web.Dockerfile:78-83 already says why:
    # the nginx master stays root because it binds port 80 and because the
    # tunnel's ingress on the Cloudflare side names that port. Only the master
    # is privileged; the workers that serve every request drop to the
    # unprivileged `nginx` user. Each name below is one thing that master does
    # while starting:
    #
    #   NET_BIND_SERVICE  binding port 80, which is the whole exception
    #   SETUID SETGID     spawning workers as `nginx`, per nginx.conf line 12
    #   CHOWN             creating and chowning the temp directories under
    #                     /var/cache/nginx
    #   DAC_OVERRIDE      opening those directories, which `nginx` owns
    #   KILL              signalling workers that run under a different uid
    #
    # Moving to the unprivileged nginx variant means moving to port 8080 and
    # changing the tunnel route, which is Stijn's to do, and would leave this
    # list empty.
    #
    # UNVERIFIED against a running container, for the same reason as `db`, and
    # this is the service that serves the site: a missing capability here is a
    # container that will not start at all. Bring the stack up once on the host
    # before the first deploy that carries this file.
    cap_add: [NET_BIND_SERVICE, SETUID, SETGID, CHOWN, DAC_OVERRIDE, KILL]
    # service_healthy, not service_started. `up -d` returns as soon as every
    # container it started is running, and "running" says nothing about whether
    # the thing inside it works. Measured on 2026-08-21 with a deliberately
    # broken api image and `condition: service_started`: `up -d` printed
    # `Container ampeer-api-1  Started` and exited 0, the api container was
    # `Restarting (1)` from then on, and the first red was two steps later at
    # `migrate`. A deploy that goes green on a broken image is the worst of the
    # two failures, because by then the previous container has been destroyed.
    #
    # With this condition compose waits for the api image's own HEALTHCHECK and
    # fails the `up` itself, which is the step a person is watching. It costs
    # availability on a good deploy: measured the same day over a probe every
    # 0.23 seconds, the window in which nothing served went from 0.74 to 3.29
    # seconds, because web now starts after the api's first successful probe.
    #
    # It also happens to be the ordering `web` genuinely needs, and that part is
    # not a fix. nginx resolves every upstream while it parses its
    # configuration, so `web` cannot start at all while the name `api` does not
    # resolve; measured the same day, a broken api image left web itself in a
    # restart loop on `nginx: [emerg] host not found in upstream "api"` and the
    # statically exported site, which needs no api and no database, served
    # nothing. That coupling is not fixable from this file: it needs a
    # `resolver` and a variable `proxy_pass` in infra/nginx/nginx.conf, so
    # nginx defers the lookup to request time and answers 502 for /api/ while
    # still serving every page. See infra/README.md.
    depends_on:
      api:
        condition: service_healthy

  tunnel:
    networks: [edge]
    image: cloudflare/cloudflared:2026.8.2@sha256:0aa26e284f05e6c77ae375b8c9c11d9eb6a448fb7bcd8d40f31cb6176189eb38
    logging: *logging
    restart: unless-stopped
    security_opt: *no-new-privileges
    mem_limit: 256m
    # cloudflared makes an outbound connection and does nothing else. It binds
    # no privileged port, changes no ownership and switches to no user, so
    # there is nothing to add back.
    cap_drop: [ALL]
    # The token is an environment variable and not an argument, and the
    # difference is who can read it.
    #
    # infra/.env.example already says what this credential is worth: whoever
    # reads it can run a connector for this tunnel. On the command line it was
    # additionally in `docker inspect` output and in /proc/<pid>/cmdline, which
    # is world readable, so any local account on the LXC could read it.
    # /proc/<pid>/environ is mode 0400 and owner only, which is the whole gain.
    #
    # It is worth being exact about what this does not fix, because a wider
    # claim was made for it once: nothing in this repository backs up
    # /var/lib/docker and scripts/backup_db.sh is a pg_dump, so the token was
    # never in a host backup either way.
    #
    # TUNNEL_TOKEN is the name cloudflared reads, verified rather than assumed,
    # because getting it wrong takes the site off the internet. Three sources
    # agree: the flag is declared in cloudflared's own source as
    # `EnvVars: []string{"TUNNEL_TOKEN"}`, Cloudflare's run-parameters page
    # lists TUNNEL_TOKEN beside `--token`, and their Kubernetes deployment
    # guide supplies it exactly this way from a secret.
    #
    # A compose `secrets:` entry would be better still, because the token would
    # then be a file under /run/secrets and not in the container environment at
    # all, and cloudflared has a `--token-file` flag for that. It is not done
    # here because it needs two things that cannot be checked with Docker down:
    # that the compose on the LXC is new enough for a secret sourced from
    # `environment:`, and that `--token-file` is in the pinned image rather
    # than only in a later one.
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run
    depends_on:
      web:
        condition: service_started

networks:
  # Two networks, and the split is a security boundary rather than tidiness.
  #
  # Everything used to sit on one implicit default network. Cloudflare Tunnel
  # makes every request to the origin internally between `cloudflared` and the
  # origin, so REMOTE_ADDR is always a bridge address and there is no peer
  # signal telling "came through nginx" apart from "came from anything else on
  # the bridge". Anything holding a position on that flat network could reach
  # api:8000 directly, around nginx, and then forge X-Forwarded-Proto, which is
  # Django's only TLS signal, and X-Forwarded-For, which is what the throttle
  # counts. Django's own SECURE_PROXY_SSL_HEADER documentation makes "your proxy
  # strips the header from all incoming requests" a precondition for setting it
  # at all; nginx satisfies that and a direct connection to api:8000 does not.
  #
  # The likeliest holder of that position is `tunnel`: the one image here that
  # is not built from this repository and the only one that talks to the
  # internet. It is now on `edge` alone, so it can reach `web` and nothing else.
  #
  # `back` is deliberately NOT `internal: true`. The api makes outbound calls to
  # PVGIS, which CLAUDE.md's allowlist permits, and an internal network has no
  # route out. The finding this fixes is about INGRESS: which containers can be
  # reached from the one that faces the internet.
  edge:
  back:

volumes:
  ampeer-db:
