# Pinning actions to a SHA stops a moved tag from changing what runs. It also
# means nothing ever updates unless something updates it, which is why this file
# is not optional: without it, SHA pinning trades one risk for another.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    target-branch: "dev"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    target-branch: "dev"

  # frontend/pnpm-lock.yaml. Without this entry the lockfile is updated by
  # nothing, while `pnpm audit --audit-level low` in the `dependencies` job
  # fails on the first advisory at any severity against any of the several
  # hundred packages the browser executes. That is a required check going red
  # with no automation anywhere producing the fix, which is the risk the header
  # above names: pinning without dependabot trades one risk for another.
  # tests/test_pipeline_contract.py pairs this list against the lockfiles that
  # exist, so a third ecosystem cannot arrive unwatched either.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    target-branch: "dev"
    ignore:
      # @types/node describes a runtime rather than shipping one, so its major
      # is not a version to choose: it is a reading of frontend/.nvmrc, which
      # every job resolves through `node-version-file`. Types for a newer major
      # declare APIs the installed Node does not have, and nothing in this
      # repository would go red for it. `typecheck` would pass over a call that
      # crashes at runtime, which is the one failure that gate exists to catch.
      #
      # Refused twice before this line existed, as #55 and again as #76 one
      # cycle later. Closing the pull request is not an answer the updater
      # remembers; it proposes the next patch of the same major and the refusal
      # has to be argued again by whoever is looking.
      #
      # Majors only. A patch inside major 24 is still a better description of
      # the runtime we run and is taken like any other. There is no security
      # case being suppressed here either: this package is type definitions and
      # executes nothing, in CI or in a browser.
      #
      # The pairing this protects is asserted by
      # test_the_node_types_describe_the_node_that_runs in
      # tests/test_pipeline_contract.py, so raising .nvmrc without raising the
      # types goes red rather than quiet. Lift both together and delete
      # nothing here: the rule is about majors, not about 24.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # The OS layer that actually ships. Five base images are pinned by digest and
  # until 2026-09-02 nothing revisited any of them: no gate in this repository
  # could go red for a CVE in bookworm, nginx or Postgres, and no pull request
  # would ever propose the fix. That is precisely the risk the header above
  # names, applied to images instead of actions.
  #
  # Two directories, because the updater reads Dockerfiles and compose files
  # separately. `postgres` carries a tag again beside its digest: it was
  # digest-only, and an image with no tag gives the updater no version to
  # reason about, so it cannot tell that a newer one exists. Docker resolves by
  # digest when both are present, so what runs is unchanged; the tag is there
  # to be read, and it is the one the digest was resolved from, recorded in
  # docs/superpowers/plans/ on 2026-08-21, not guessed.
  - package-ecosystem: "docker"
    directory: "/infra"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    target-branch: "dev"

  - package-ecosystem: "docker-compose"
    directory: "/infra"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    target-branch: "dev"
