name: ci

on:
  push:
    branches: [dev, "feat/**"]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every job here pins runs-on to a GitHub hosted runner on purpose. A
# self-hosted runner is registered on this repository, and these workflows
# trigger on push to feat/** where no ruleset applies. A job that selected
# self-hosted would therefore run unreviewed code inside the owner's own
# network. tests/test_pipeline_contract.py fails if any job here says
# self-hosted, so the rule defends itself rather than relying on this comment.
jobs:
  # WARNING: this job name is a required status check in the main ruleset.
  # Renaming it makes that check never arrive, and every pull request to main
  # hangs forever waiting for it. Change scripts/setup_rulesets.sh at the same
  # time or not at all.
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job only reads. Leaving the token in .git/config would hand it
          # to every tool that runs afterwards.
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          # No python-version input. setup-uv v10 has no
          # `python-version-file`, so the line that used to sit here was
          # silently ignored and only showed up as a workflow annotation,
          # which does not fail a build. uv reads .python-version itself
          # when it builds the environment, so that file stays the single
          # source of truth. tests/test_pipeline_contract.py asserts the
          # interpreter that actually runs matches it.
          enable-cache: true
      - run: uv sync --locked --group dev --group backend
      - run: uv run ruff check ampeer_sim ampeer_advice backend tests tools
      - run: uv run ruff format --check ampeer_sim ampeer_advice backend tests tools
      - run: uv run mypy ampeer_sim ampeer_advice backend tests tools
      # Django's own deployment checklist, against the settings module wsgi.py
      # names, with warnings fatal. At the default fail level a warning about a
      # missing HSTS header or an absent CSRF middleware prints and exits zero,
      # which is a check that cannot go red. Nothing here connects to a
      # database, so the credentials below only have to exist; they are
      # generated rather than written down so this file holds no value that
      # looks like a secret.
      - name: Django deployment checklist, under production settings
        env:
          DJANGO_SETTINGS_MODULE: ampeer.settings.prod
          DJANGO_ALLOWED_HOSTS: ampeer.nl
          AMPEER_NEDU_PROFILE_PATH: /srv/ampeer/nedu-profiles-2025.csv
          POSTGRES_DB: ampeer
          POSTGRES_USER: ampeer
          POSTGRES_HOST: db
          DJANGO_NUM_PROXIES: "1"
          DJANGO_CORS_ALLOWED_ORIGINS: https://ampeer.nl
        run: |
          set -euo pipefail
          DJANGO_SECRET_KEY="$(uv run python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          POSTGRES_PASSWORD="$(uv run python -c 'import secrets; print(secrets.token_urlsafe(16))')"
          export DJANGO_SECRET_KEY POSTGRES_PASSWORD
          uv run python backend/manage.py check --deploy --fail-level WARNING
      # The pre-commit hooks are opt-in per clone and skippable with
      # --no-verify. Running them here makes that a local convenience rather
      # than a permanent exit.
      - run: uv run pre-commit run --all-files --show-diff-on-failure

  # WARNING: required status check. See the note on `quality`.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Postgres and not SQLite, because the schema under test must be the schema
    # that ships. An in-memory database in the tests and a real one in
    # production hides a whole class of fault.
    services:
      postgres:
        # Digest resolved from Docker Hub on 2026-08-21 for postgres:16-alpine.
        # Pinned rather than tagged for the same reason every action here is
        # pinned: a tag is a name someone else can repoint.
        image: postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_DB: ampeer
          POSTGRES_USER: ampeer
          POSTGRES_PASSWORD: ampeer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ampeer"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          # No python-version input. setup-uv v10 has no
          # `python-version-file`, so the line that used to sit here was
          # silently ignored and only showed up as a workflow annotation,
          # which does not fail a build. uv reads .python-version itself
          # when it builds the environment, so that file stays the single
          # source of truth. tests/test_pipeline_contract.py asserts the
          # interpreter that actually runs matches it.
          enable-cache: true
      - run: uv sync --locked --group dev --group backend
      - run: uv run pytest --cov --cov-report=term-missing
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: "5432"
          POSTGRES_DB: ampeer
          POSTGRES_USER: ampeer
          POSTGRES_PASSWORD: ampeer

  # WARNING: this job name is a required status check in the main ruleset.
  # See the note on `quality`. Separate from `quality` on purpose: that job
  # builds a Python environment, and a mixed job makes a red build harder to
  # read.
  frontend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
      # Deliberately no `cache: pnpm` on the step above. setup-node resolves the
      # cache directory by shelling out to `pnpm store path`, and ubuntu-latest
      # ships no pnpm, so that runs before the line below has created the shim
      # and the step fails outright. Verified against the action's own
      # cache-utils.ts at the pinned SHA and against the runner image manifest.
      # Enabling corepack first from the preinstalled Node would put the shim on
      # a Node that setup-node then replaces. A cache is a speed-up and not a
      # gate, so it is dropped rather than made fragile.
      - run: corepack enable
      # --frozen-lockfile is the gate: it fails rather than resolving anything
      # the lockfile does not already pin.
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # The Python half has run `ruff format --check` since the first
      # commit. This side had eslint and tsc and no formatter at all, so
      # `quality` and `frontend-quality` were not the same gate under two
      # names. tests/test_pipeline_contract.py now asserts both read it.
      - run: pnpm format:check

  # WARNING: required status check. See the note on `quality`.
  frontend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
      # See the note in frontend-quality on why there is no cache here.
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # The end to end tests run against the built output and not against a dev
      # server, so the build has to happen before them. That is also what ships.
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
