name: deploy

# The only workflow in this repository with a job on the self-hosted runner,
# and the only one that can change what is running on the host.
#
# tests/test_pipeline_contract.py refuses every job that says `self-hosted`,
# because ci.yml and security.yml trigger on push to feat/** where no ruleset
# applies, so such a job would run whatever somebody pushed inside the owner's
# own network. This workflow is the single named exception to that rule, and it
# is only defensible because of the four properties below. Each one has a test.
#
#   1. It triggers on a tag and on nothing else. No branch, no pull request, no
#      workflow_dispatch. The runner cannot be reached by pushing code.
#   2. The `deploy` job declares `environment: production`, so a tag push is a
#      request that waits for a review rather than a deploy.
#   3. That job checks nothing out and builds nothing. There is no source on
#      the host, no build chain, and no token that can read the repository.
#   4. It logs out of the registry when it finishes. web2 is not ephemeral,
#      measured on 2026-08-21, so anything left in the runner's home directory
#      is there for the next job as well.
#
# Widening any of the four is how the original rule gets removed slowly, so
# tests/test_deploy_workflow.py asserts all four and asserts that the exception
# list holds exactly one job.
on:
  push:
    tags: ["v*"]

# Read by default. `build` raises its own to `packages: write` and `deploy`
# lowers its own to `packages: read`, both scoped to the job.
permissions:
  contents: read

# Two deploys running `migrate` against one database at the same time is the
# failure this prevents; cancel-in-progress stays false because cancelling a
# deploy halfway leaves the stack half migrated, which is worse than waiting.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # Builds on a GitHub-hosted runner and publishes to GHCR. Everything that
  # needs the source happens here, which is what leaves the host with nothing
  # to compromise.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes. Leaving the token in .git/config would hand it
          # to every tool that runs afterwards, including a Docker build.
          persist-credentials: false

      # The web image copies frontend/out in rather than building it, so the
      # site has to be exported before the image is built. It is exported here
      # and not in the Dockerfile so the published image is the same output
      # `frontend-test` already ran the end to end suite against.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
      # See the note in ci.yml on why there is no pnpm cache on the step above.
      - run: corepack enable
        working-directory: frontend
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Export the static site against its own origin
        working-directory: frontend
        env:
          # Empty on purpose, and this is the only place it is empty. api.ts
          # falls back to http://127.0.0.1:8000 when the variable is absent,
          # which is the development default; an absent variable here would
          # bake a localhost URL into the production bundle and every visitor
          # would get a failed request against their own machine. Empty makes
          # the client use relative paths, which is what same-origin means.
          NEXT_PUBLIC_API_BASE: ""
        run: pnpm build

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Both images carry the tag that started this run, and infra/docker-compose.yml
      # pulls exactly that tag through AMPEER_VERSION. A deploy is therefore one
      # string, which is what makes a rollback a rollback and not a rebuild.
      - name: Build and push the api image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: infra/api.Dockerfile
          push: true
          tags: ghcr.io/stijnvandepol/ampeer-api:${{ github.ref_name }}
          provenance: true

      - name: Build and push the web image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: infra/web.Dockerfile
          push: true
          tags: ghcr.io/stijnvandepol/ampeer-web:${{ github.ref_name }}
          provenance: true

  # Runs on the LXC. Four commands and a logout.
  deploy:
    needs: build
    runs-on: self-hosted
    timeout-minutes: 15
    # The review gate. Reviewers and the deployment branch policy are
    # configured on the environment in repository settings, not here; that
    # policy is what keeps a tag cut from a feature branch from deploying, and
    # setting it is the owner's, like the runner itself.
    environment: production
    # Pull two private packages, and nothing else. Naming one permission sets
    # every unnamed one to none, so this token cannot read the repository.
    permissions:
      packages: read
    env:
      # Shell environment beats the env file in compose interpolation, so this
      # decides which release runs even when the file on the host still names
      # the previous one.
      AMPEER_VERSION: ${{ github.ref_name }}
      # The stack lives here. docker-compose.yml, .env and preflight_env.sh are
      # placed on the host by hand from this repository, because nothing here
      # can write to the LXC and a job that could would be a job that can
      # change what runs without a review.
      STACK: /srv/ampeer
      # The sha256 of scripts/preflight_env.sh in this repository at this tag.
      #
      # The script is copied to the host by hand and this job has no checkout,
      # so the copy it runs is whatever was left there last time. Until
      # 2026-08-21 nothing anywhere noticed the difference: an out-of-date copy
      # still exits zero, so the deploy stayed green and the check somebody had
      # just added was not running. That is the same silent shape as the purge
      # nobody scheduled.
      #
      # A version string was the alternative and it is weaker: it detects a
      # copy somebody forgot to update only if they also remembered to update
      # the version, which is the thing they forgot. A digest is derived from
      # the content, so it cannot be forgotten separately from the content.
      #
      # tests/test_stack_smoke.py recomputes this from the script on every pull
      # request, so this literal cannot drift from the repository. It can only
      # disagree with the host, which is exactly the disagreement worth
      # stopping a deploy for.
      PREFLIGHT_SHA256: afea38d65a18963d7ad089ecbce20d80d9abb275878ed3bfdd01728994f02e8d
    steps:
      # Before the preflight, because a preflight from an older release checks
      # an older list of variables and passing it means nothing.
      - name: Confirm the preflight on the host is the one from this release
        run: |
          set -euo pipefail
          if [ ! -f "$STACK/preflight_env.sh" ]; then
            echo "no preflight at $STACK/preflight_env.sh" >&2
            echo "copy scripts/preflight_env.sh from this tag to $STACK/ and redeploy" >&2
            exit 1
          fi
          actual="$(sha256sum "$STACK/preflight_env.sh" | cut -d' ' -f1)"
          if [ "$actual" != "$PREFLIGHT_SHA256" ]; then
            echo "the preflight on the host is not the one from this release" >&2
            echo "  on the host: $actual" >&2
            echo "  this release: $PREFLIGHT_SHA256" >&2
            echo "copy scripts/preflight_env.sh from this tag to $STACK/ and redeploy" >&2
            exit 1
          fi

      # First, before anything restarts. A container in a restart loop over a
      # missing variable is an outage that looks like a code fault, on a host
      # nobody is logged in to.
      # Invoked through bash rather than executed, so a hand copy that arrived
      # without its executable bit fails on a missing variable it can report
      # rather than on "permission denied" from a step whose name says
      # something else.
      - name: Check the nine variables and the profile file
        run: bash "$STACK/preflight_env.sh" "$STACK/.env"

      - name: Log in to the registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        # Through the environment rather than interpolated into the script, so
        # nothing from the event ends up as shell. A plain command rather than
        # an action, because this one runs inside the owner's network and every
        # third party step there is one more thing that gets to.
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      # -f rather than a working directory. Without it compose looks for a
      # compose file in the runner's own work directory and walks upwards from
      # there, which is not where the stack lives; the project directory then
      # follows the file, which is what makes the bind mount source in it
      # resolve against /srv/ampeer.
      - name: Pull what CI built
        run: >-
          docker compose -f "$STACK/docker-compose.yml" --env-file "$STACK/.env"
          pull

      - name: Start it
        run: >-
          docker compose -f "$STACK/docker-compose.yml" --env-file "$STACK/.env"
          up -d --remove-orphans

      # After `up`, so it runs against the image that is now serving, and with
      # --noinput because there is no terminal attached to this.
      - name: Migrate
        run: >-
          docker compose -f "$STACK/docker-compose.yml" --env-file "$STACK/.env"
          run --rm api python backend/manage.py migrate --noinput

      # The second of the two places `purge_expired_advice --check` runs, and
      # the only one that runs on a schedule anybody can see. The other is
      # ExecStartPost on the purge unit.
      #
      # It is here rather than in a healthcheck, which is what the design
      # originally said. The api container's readiness check issues no database
      # query on purpose: it runs every thirty seconds, and a check that counts
      # rows that often is a load generator with a nice name. A deploy happens
      # rarely and is already a moment when somebody is looking, which is the
      # right frequency for a question about a daily timer.
      #
      # After migrate, so the schema is current and a check cannot fail on a
      # column the previous release did not have.
      #
      # What it catches: retention that has stopped. If the timer died three
      # months ago, rows are sitting past their ninety days and this exits
      # non-zero, so the deploy goes red and says how many and how old.
      #
      # What it does NOT catch: a timer that was never enabled at all, for the
      # first ninety-one days of this service's life, because there is nothing
      # overdue yet to find. Only `systemctl list-timers ampeer-purge.timer`
      # answers that, and nothing in this repository can run it. It is written
      # down in infra/README.md rather than papered over here.
      - name: Confirm expired advice is still being deleted
        run: >-
          docker compose -f "$STACK/docker-compose.yml" --env-file "$STACK/.env"
          run --rm --entrypoint python api backend/manage.py purge_expired_advice --check

      # always(), because the deploys that fail are the ones that would
      # otherwise leave a registry credential in ~/.docker/config.json on a
      # runner that keeps its home directory between jobs.
      - name: Drop the registry credential
        if: always()
        run: docker logout ghcr.io
