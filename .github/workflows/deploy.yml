name: deploy

# The only workflow in this repository with a job on the self-hosted runner,
# and the only one that can change what is running on the host.
#
# tests/test_pipeline_contract.py refuses every job that says `self-hosted`,
# because ci.yml triggers on push to feat/**, where no ruleset applies, so such
# a job would run whatever somebody pushed inside the owner's own network.
# security.yml is narrower and its earliest trigger is a pull request; the
# refusal covers both anyway, because a rule about the whole repository is
# easier to keep true than one that has to be rechecked per workflow. This workflow is the single named exception to that rule, and it
# is only defensible because of the four properties below. Each one has a test.
#
#   1. It triggers on a tag and on nothing else. No branch, no pull request, no
#      workflow_dispatch. The runner cannot be reached by pushing code.
#   2. The `deploy` job declares `environment: production`, so a tag push is a
#      request that waits for a review rather than a deploy.
#   3. That job checks nothing out and builds nothing. There is no source on
#      the host, no build chain, and no token that can read the repository.
#   4. It logs out of the registry when it finishes. web2 is not ephemeral,
#      measured on 2026-08-21, so anything left in the runner's home directory
#      is there for the next job as well.
#
# Widening any of the four is how the original rule gets removed slowly, so
# tests/test_deploy_workflow.py asserts all four and asserts that the exception
# list holds exactly one job.
on:
  push:
    tags: ["v*"]

# Read by default. `build` raises its own to `packages: write` and `deploy`
# lowers its own to `packages: read`, both scoped to the job.
permissions:
  contents: read

# Two deploys running `migrate` against one database at the same time is the
# failure this prevents; cancel-in-progress stays false because cancelling a
# deploy halfway leaves the stack half migrated, which is worse than waiting.
# Measured on 2026-08-21: the second run's `migrate` fails loudly and the first
# run's schema survives, which is the behaviour asked for.
#
# The edge, written down because nothing in a workflow file can close it.
# GitHub keeps at most one *pending* run per concurrency group and cancels the
# older one. A run waiting on the `production` review is pending, so pushing v3
# while v2 is still waiting cancels v2: the tag exists, its images are in GHCR,
# and nothing deployed them. It is silent in the sense that matters, because
# there is no failure to read, only a run marked cancelled in a tab nobody is
# looking at.
#
# Not guarded, deliberately, and there are only two ways to guard it. Keying
# the group per tag (`group: deploy-${{ github.ref_name }}`) stops the
# cancellation and gives back the concurrent `migrate` this group exists to
# prevent, which trades a stale deploy for a corrupted schema. A step that
# reported the cancellation cannot exist either: the run that would report it
# is the run being cancelled, so there is nothing left to run the step.
#
# What is left is knowing it: after approving a deploy, check that the run for
# the tag below it actually started. The failure mode is a release that is
# tagged, built and not running, which is visible as the old version still
# being served.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # Builds on a GitHub-hosted runner and publishes to GHCR. Everything that
  # needs the source happens here, which is what leaves the host with nothing
  # to compromise.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    # The two digests this run pushed. A step output dies with its job, so
    # without these the deploy job has no name for the images except the tag,
    # and the tag is the thing that can be repointed while the review below is
    # open. See the note on the check that reads them.
    outputs:
      api-digest: ${{ steps.api-image.outputs.digest }}
      web-digest: ${{ steps.web-image.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes. Leaving the token in .git/config would hand it
          # to every tool that runs afterwards, including a Docker build.
          persist-credentials: false

      # The web image copies frontend/out in rather than building it, so the
      # site has to be exported before the image is built. It is exported here
      # and not in the Dockerfile so the published image is the same output
      # `frontend-test` already ran the end to end suite against.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
      # See the note in ci.yml on why there is no pnpm cache on the step above.
      - run: corepack enable
        working-directory: frontend
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Export the static site against its own origin
        working-directory: frontend
        env:
          # Empty on purpose, and this is the only place it is empty. api.ts
          # falls back to http://127.0.0.1:8000 when the variable is absent,
          # which is the development default; an absent variable here would
          # bake a localhost URL into the production bundle and every visitor
          # would get a failed request against their own machine. Empty makes
          # the client use relative paths, which is what same-origin means.
          NEXT_PUBLIC_API_BASE: ""
        run: pnpm build

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Both images carry the tag that started this run, and infra/docker-compose.yml
      # pulls exactly that tag through AMPEER_VERSION. A deploy is therefore one
      # string, which is what makes a rollback a rollback and not a rebuild.
      #
      # `provenance: true`, stated plainly because it reads as a control and is
      # not one here. It makes buildkit attach a provenance attestation to the
      # pushed index, recording which workflow, which commit and which
      # Dockerfile produced the image. Nothing in this repository or on the
      # host reads it, and it is not signed by anything the host could check,
      # so today it is a record for a person doing a post mortem and no part of
      # any gate. Turning it into one would mean `actions/attest-build-provenance`
      # in this job and `gh attestation verify` on the LXC, which needs a
      # GitHub token and an outbound call from the host at deploy time; that is
      # a decision about the host, not about this file. What actually closes
      # the window between the build and the pull is the digest comparison in
      # the deploy job below, which needs nothing on the host but docker.
      #
      # `id:` on both steps, because the digest each one reports is what that
      # comparison is made against.
      - name: Build and push the api image
        id: api-image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: infra/api.Dockerfile
          push: true
          tags: ghcr.io/stijnvandepol/ampeer-api:${{ github.ref_name }}
          provenance: true

      - name: Build and push the web image
        id: web-image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: infra/web.Dockerfile
          push: true
          tags: ghcr.io/stijnvandepol/ampeer-web:${{ github.ref_name }}
          provenance: true

  # Runs on the LXC. It checks what is on the host against this release, pulls
  # what CI built, migrates, switches, and logs out. The count that used to
  # stand here stopped being true some releases ago; the order is the property
  # worth stating, and tests/test_deploy_workflow.py holds every step of it.
  deploy:
    needs: build
    runs-on: self-hosted
    timeout-minutes: 15
    # The review gate. Reviewers and the deployment branch policy are
    # configured on the environment in repository settings, not here; that
    # policy is what keeps a tag cut from a feature branch from deploying, and
    # setting it is the owner's, like the runner itself.
    environment: production
    # Pull two private packages, and nothing else. Naming one permission sets
    # every unnamed one to none, so this token cannot read the repository.
    permissions:
      packages: read
    env:
      # Shell environment beats the env file in compose interpolation, so this
      # decides which release runs even when the file on the host still names
      # the previous one.
      AMPEER_VERSION: ${{ github.ref_name }}
      # The stack lives here. docker-compose.yml, .env and preflight_env.sh are
      # placed on the host by hand from this repository, because nothing here
      # can write to the LXC and a job that could would be a job that can
      # change what runs without a review.
      STACK: /srv/ampeer
      # The host holds two things now and only two: the environment file,
      # which is a secret and cannot live in a repository, and the
      # consumption profile, which is gitignored because it is not ours to
      # redistribute. Everything else comes from the checkout below, so
      # there is nothing left to copy by hand and nothing left to verify by
      # digest.
    steps:
      # THE CHECKOUT THIS JOB USED NOT TO HAVE, added 2026-09-14.
      #
      # Until today it checked nothing out, so three files had to be copied
      # to /srv/ampeer by hand and were verified here by sha256. Four
      # releases died on that: v0.2.0, v0.3.0, v0.4.0 and v0.5.0 all stopped
      # on `no preflight at /srv/ampeer/preflight_env.sh`, and nothing was
      # ever deployed at all.
      #
      # The property the absence was said to buy does not survive being
      # looked at. Whoever can push a tag already decides what this job
      # runs, because this workflow file comes from that same tag. The gate
      # is that it triggers on `v*` and on nothing else, and that is
      # unchanged. What no checkout actually bought was a smaller blast
      # radius afterwards, paid for with a manual step nobody performed four
      # times running. That is not a trade worth keeping.
      #
      # persist-credentials: false, because this runner is not ephemeral and
      # a token left in .git/config outlives the job that needed it.
      - name: Check out the tag being deployed
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the thirteen variables and the profile file
        run: bash "$GITHUB_WORKSPACE/scripts/preflight_env.sh" "$STACK/.env"

      - name: Log in to the registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        # Through the environment rather than interpolated into the script, so
        # nothing from the event ends up as shell. A plain command rather than
        # an action, because this one runs inside the owner's network and every
        # third party step there is one more thing that gets to.
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      # -f rather than a working directory. Without it compose looks for a
      # compose file in the runner's own work directory and walks upwards from
      # there, which is not where the stack lives; the project directory then
      # follows the file, which is what makes the bind mount source in it
      # resolve against /srv/ampeer.
      - name: Pull what CI built
        run: >-
          docker compose -f "$GITHUB_WORKSPACE/infra/docker-compose.yml" --env-file "$STACK/.env"
          pull

      # The approval window, closed after the fact rather than by removing the
      # tag.
      #
      # docker-compose.yml pulls `:${AMPEER_VERSION}`, and between the build
      # job above and the pull just now sits the `production` review, which can
      # take hours. A tag is a name: anyone holding `packages: write` on this
      # repository can repoint ampeer-api:v0.1.0 while the review is open, and
      # the reviewer then approves the run they read while the host pulls what
      # the tag says at pull time. Nothing in the run would look wrong.
      #
      # A digest in the compose file would close it and cost more than it
      # buys: the tag is what lets this host bring itself back up after a
      # reboot with no CI alive, what makes a rollback one string in a file a
      # person can read, and what keeps .env readable. So the tag stays and the
      # pull is checked instead. `pull` has already resolved the tag, so this
      # reads the digest the daemon recorded for what it fetched and compares
      # it to the digest the build job says it pushed. A repointed tag fails
      # here, before `up`, with the old release still serving.
      #
      # What this does not cover, stated rather than implied: a rollback, which
      # is an operator running `docker compose up -d` on the host with an older
      # AMPEER_VERSION. There is no build job in that path to say what the
      # digest should be and no CI run at all, so an old tag repointed weeks
      # ago is pulled without anything objecting. That is the price of the tag
      # being usable while CI is not, and it is the operation the tag exists to
      # make easy, so it is the one to be careful with: check the digest by
      # hand against the run that published it before rolling back to a
      # release old enough that somebody could have repointed it.
      - name: Confirm the images are the ones this run built
        env:
          API_DIGEST: ${{ needs.build.outputs.api-digest }}
          WEB_DIGEST: ${{ needs.build.outputs.web-digest }}
        run: |
          set -euo pipefail
          for name in api web; do
            case "$name" in
              api) expected="$API_DIGEST" ;;
              web) expected="$WEB_DIGEST" ;;
            esac
            image="ghcr.io/stijnvandepol/ampeer-$name:$AMPEER_VERSION"
            if [ -z "$expected" ]; then
              echo "the build job published no digest for $image" >&2
              exit 1
            fi
            actual="$(docker image inspect --format '{{index .RepoDigests 0}}' "$image")"
            if [ "${actual#*@}" != "$expected" ]; then
              echo "$image is not the image this run built" >&2
              echo "  pulled: ${actual#*@}" >&2
              echo "  built:  $expected" >&2
              echo "the tag was repointed between the build and this pull" >&2
              exit 1
            fi
          done

      # Before `up`, because after it the container that carries the answer is
      # gone. This is the whole of the fallback machinery: a release is one
      # string, and the string the host is serving right now is written on the
      # container that is serving it.
      #
      # Empty output on a first deploy rather than a failure. There is nothing
      # to fall back to then, and saying so at the moment it matters beats
      # refusing to deploy a stack that does not exist yet.
      - name: Record the release that is running now
        id: current
        run: |
          set -euo pipefail
          container="$(docker compose -f "$GITHUB_WORKSPACE/infra/docker-compose.yml" --env-file "$STACK/.env" ps -q api | head -n 1)"
          if [ -z "$container" ]; then
            echo "no api container is running, so this deploy has nothing to fall back to"
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          image="$(docker inspect --format '{{.Config.Image}}' "$container")"
          echo "currently serving ${image##*:}"
          echo "version=${image##*:}" >> "$GITHUB_OUTPUT"

      # Before `migrate`, and that placement is the point of the step rather
      # than a detail of it. This deploy applies migrations and nothing rolls a
      # schema back, so the moment a recent dump matters is the moment before
      # the first statement runs. A check that sat at the end of the job would
      # tell an operator there is no backup immediately after the release that
      # needed one.
      #
      # It reads the directory and nothing else. No database, no container: the
      # question is whether anything is backing this host up, and a check that
      # needed the service it checks could not answer it on a host where that
      # service is the thing that broke.
      #
      # A first deploy fails here, because there is no backup directory until
      # somebody has installed the timer and let it run once. That is the same
      # shape as the preflight refusing to run without an env file, and it is
      # written down in section 8 of infra/README.md rather than smoothed over
      # with a default that would make an absent backup look like a present one.
      - name: Confirm something is backing this database up
        run: bash "$GITHUB_WORKSPACE/scripts/backup_db.sh" --check

      # Before `up`, and that ordering is the point of this step rather than a
      # detail of it.
      #
      # It used to run after. That put every deploy through a window in which
      # the new code was already serving against the previous schema, and there
      # is no version of that window that is safe: the release is live and the
      # column it reads does not exist yet. A migration that then failed left
      # the site serving errors with no step left to abort.
      #
      # Running it first inverts the window to old code against the new schema,
      # and that one is safe as long as a migration only adds. So this ordering
      # is not free, it buys the safe half of a trade in exchange for a rule:
      #
      #   A migration must leave the previous release able to serve. Add a
      #   column, backfill it, and only drop the old one in a later release.
      #
      # The rule is not enforceable from here. What is enforceable, and what
      # this ordering gives, is that a migration which fails stops the deploy
      # while the previous release is still whole and still serving.
      #
      # `run --rm` builds a one-off container from the image this run pulled
      # and leaves the running api container alone, so nothing switches here.
      # --noinput because no terminal is attached to this.
      - name: Migrate, while the previous release is still serving
        run: >-
          docker compose -f "$GITHUB_WORKSPACE/infra/docker-compose.yml" --env-file "$STACK/.env"
          run --rm api python backend/manage.py migrate --noinput

      # `id:` so the fallback below can name this step rather than asking
      # whether anything at all failed. Two steps in this job run `up -d` and
      # tests/test_deploy_workflow.py asserts that exactly one of them is
      # unconditional, because the day that stops being true this job starts
      # the stack twice and calls it a deploy.
      - name: Start it
        id: start
        run: >-
          docker compose -f "$GITHUB_WORKSPACE/infra/docker-compose.yml" --env-file "$STACK/.env"
          up -d --remove-orphans

      # `up -d` recreates the api container before compose waits on its health,
      # so a release that never becomes healthy is an outage, not a refusal.
      # Until this step existed, ending that outage was a person noticing,
      # logging into the LXC and editing AMPEER_VERSION by hand. The tag it
      # would be edited to is the one recorded above.
      #
      # This step exits zero when the fallback works, and the job stays red
      # anyway because `Start it` failed. That is deliberate. A fallback that
      # turned the run green would teach this pipeline that an outage is a
      # successful deploy, and the next release would be cut on top of a
      # version nobody knows is not running.
      #
      # What it cannot undo is the migration, which ran before the switch and
      # has already been applied. The old code is serving against the new
      # schema, which is the window the rule above exists to keep safe, and the
      # message says so rather than leaving it to be discovered.
      - name: Fall back to the release that was running
        if: failure() && steps.start.outcome == 'failure'
        env:
          PREVIOUS: ${{ steps.current.outputs.version }}
        run: |
          set -euo pipefail
          echo "::error::$AMPEER_VERSION did not come up"
          if [ -z "$PREVIOUS" ]; then
            echo "::error::nothing was running before this deploy, so there is no release to fall back to"
            echo "::error::the stack is down; check the step above for what refused to start"
            exit 1
          fi
          if [ "$PREVIOUS" = "$AMPEER_VERSION" ]; then
            echo "::error::$PREVIOUS was already the running release, so falling back would redeploy what just failed"
            echo "::error::the stack is down; check the step above for what refused to start"
            exit 1
          fi
          echo "falling back to $PREVIOUS"
          AMPEER_VERSION="$PREVIOUS" docker compose -f "$GITHUB_WORKSPACE/infra/docker-compose.yml" --env-file "$STACK/.env" up -d --remove-orphans
          echo "::error::$PREVIOUS is serving again. The database is on the schema $AMPEER_VERSION migrated it to, which the previous release is expected to tolerate; if it does not, that migration was not additive."
          echo "::error::$STACK/.env still names the old release, so a reboot brings back $PREVIOUS. Nothing needs editing on the host to stay where you are."

      # The second of the two places `purge_expired_advice --check` runs, and
      # the only one that runs on a schedule anybody can see. The other is
      # ExecStartPost on the purge unit.
      #
      # It is here rather than in a healthcheck, which is what the design
      # originally said. The api container's readiness check issues no database
      # query on purpose: it runs every thirty seconds, and a check that counts
      # rows that often is a load generator with a nice name. A deploy happens
      # rarely and is already a moment when somebody is looking, which is the
      # right frequency for a question about a daily timer.
      #
      # After migrate, so the schema is current and a check cannot fail on a
      # column the previous release did not have.
      #
      # What it catches: retention that has stopped. If the timer died three
      # months ago, rows are sitting past their ninety days and this exits
      # non-zero, so the deploy goes red and says how many and how old.
      #
      # What it does NOT catch: a timer that was never enabled at all, for the
      # first ninety-one days of this service's life, because there is nothing
      # overdue yet to find. Only `systemctl list-timers ampeer-purge.timer`
      # answers that, and nothing in this repository can run it. It is written
      # down in infra/README.md rather than papered over here.
      - name: Confirm expired advice is still being deleted
        run: >-
          docker compose -f "$GITHUB_WORKSPACE/infra/docker-compose.yml" --env-file "$STACK/.env"
          run --rm --entrypoint python api backend/manage.py purge_expired_advice --check

      # The same question for the outbox: a mail waiting longer than fifteen
      # minutes means the timer has stopped or the provider refuses
      # everything, and either is a deploy worth stopping on. After migrate,
      # for the reason the step above gives.
      - name: Confirm the outbox is being emptied
        run: >-
          docker compose -f "$GITHUB_WORKSPACE/infra/docker-compose.yml" --env-file "$STACK/.env"
          run --rm --entrypoint python api backend/manage.py send_outbound_mail --check

      # always(), because the deploys that fail are the ones that would
      # otherwise leave a registry credential in ~/.docker/config.json on a
      # runner that keeps its home directory between jobs.
      - name: Drop the registry credential
        if: always()
        run: docker logout ghcr.io
